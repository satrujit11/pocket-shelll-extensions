spec: pocketshell.ext/v0
id: supervisor
name: Supervisor
description: "Programs managed by supervisord: state, start, stop, restart."
icon: process
category: processes
version: 1.3.0
author: Pocket Shell
docs: http://supervisord.org/running.html#supervisorctl-command-line-options
license: Apache-2.0

detect:
  binaries: [supervisorctl]

permissions: [read-processes, control-processes, sudo]

errors:
  - match: "refused connection|no such file|sock"
    title: Supervisor is not running
    text: supervisorctl cannot reach supervisord. Start it (for example systemctl start supervisor) and open this again.
  - match: "Permission denied|permission denied"
    title: Supervisor needs root
    text: The control socket belongs to root. The commands already run through sudo; allow it for this user.

data:
  programs:
    run: [supervisorctl, status]
    parse: regex
    pattern: '^(?P<name>\S+)\s+(?P<state>RUNNING|STOPPED|STARTING|FATAL|BACKOFF|EXITED|STOPPING|UNKNOWN)\s*(?P<detail>.*)$'
    refresh: 5s
    privilege: sudo
  program:
    params: [name]
    run: [supervisorctl, status, "{{ params.name }}"]
    parse: regex
    pattern: '^(?P<name>\S+)\s+(?P<state>RUNNING|STOPPED|STARTING|FATAL|BACKOFF|EXITED|STOPPING|UNKNOWN)\s*(?P<detail>.*)$'
    refresh: 5s
    privilege: sudo
  logs:
    params: [name]
    run: [supervisorctl, tail, -f, "{{ params.name }}"]
    parse: lines
    stream: true
    merge_stderr: true
    privilege: sudo
  errlogs:
    params: [name]
    run: [supervisorctl, tail, -f, "{{ params.name }}", stderr]
    parse: lines
    stream: true
    merge_stderr: true
    privilege: sudo

actions:
  start:
    label: Start
    icon: play
    style: primary
    visible: "{{ (data.program | first()).state != 'RUNNING' }}"
    run: [supervisorctl, start, "{{ params.name }}"]
    privilege: sudo
  stop:
    label: Stop
    icon: stop
    style: danger
    visible: "{{ (data.program | first()).state == 'RUNNING' }}"
    run: [supervisorctl, stop, "{{ params.name }}"]
    privilege: sudo
    confirm: { title: "Stop {{ params.name }}?", text: It stays stopped until you start it. }
  restart:
    label: Restart
    icon: restart
    run: [supervisorctl, restart, "{{ params.name }}"]
    privilege: sudo
    confirm: { title: "Restart {{ params.name }}?", text: It is unavailable for a moment. }

screens:
  main:
    title: Supervisor
    subtitle: "{{ data.programs | count() }} programs"
    docs: http://supervisord.org/running.html#supervisorctl-command-line-options
    sections:
      - layout: { columns: 3 }
        components:
          - type: stat
            label: Running
            value: "{{ data.programs | where(row.state == 'RUNNING') | count() }}"
            tone: success
          - type: stat
            label: Stopped
            value: "{{ data.programs | where(row.state == 'STOPPED' || row.state == 'EXITED') | count() }}"
            tone: muted
          - type: stat
            label: Failing
            value: "{{ data.programs | where(row.state == 'FATAL' || row.state == 'BACKOFF') | count() }}"
            tone: danger
      - components:
          - type: list
            from: programs
            search: true
            sort: name
            empty: Supervisor has no programs.
            filters:
              - { id: running, label: Running, where: "{{ row.state == 'RUNNING' }}" }
              - { id: failing, label: Failing, where: "{{ row.state == 'FATAL' || row.state == 'BACKOFF' }}" }
              - { id: stopped, label: Stopped, where: "{{ row.state == 'STOPPED' }}" }
              - { id: exited, label: Exited, where: "{{ row.state == 'EXITED' }}" }
              - { id: other, label: Other, where: "{{ row.state != 'RUNNING' && row.state != 'FATAL' && row.state != 'BACKOFF' && row.state != 'STOPPED' && row.state != 'EXITED' }}" }
            item:
              title: "{{ row.name }}"
              subtitle: "{{ row.detail }}"
              trailing: "{{ row.state }}"
              tone: "{{ row.state == 'RUNNING' ? 'success' : (row.state == 'FATAL' || row.state == 'BACKOFF' ? 'danger' : 'muted') }}"
            on_tap: { screen: detail, params: { name: "{{ row.name }}" } }

  detail:
    params: [name]
    docs: http://supervisord.org/running.html
    title: "{{ params.name }}"
    subtitle: "{{ (data.program | first()).state }}"
    actions: [start, stop, restart]
    sections:
      - components:
          - type: stat
            label: State
            value: "{{ (data.program | first()).state }}"
            detail: "{{ (data.program | first()).detail }}"
            tone: "{{ (data.program | first()).state == 'RUNNING' ? 'success' : 'danger' }}"
      - title: Output
        components:
          - type: logs
            search: true
            streams:
              - { id: out, label: Output, from: logs }
              - { id: err, label: Errors, from: errlogs, tone: danger }
            levels:
              - { match: "error|fatal|exception|traceback", level: error }
              - { match: "warn", level: warn }
