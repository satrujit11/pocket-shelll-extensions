name: containers, images, volumes, networks, detail and actions
fakes:
  docker: |
    case "$1 $2" in
      "--version "*) echo "Docker version 26.1.0" ;;
      "ps -a") cat <<'EOF'
    {"ID":"aaa111","Names":"web","Image":"nginx:1","State":"running","Status":"Up 2 hours"}
    {"ID":"bbb222","Names":"db","Image":"postgres:16","State":"exited","Status":"Exited (0) 1 hour ago"}
    {"ID":"ccc333","Names":"odd","Image":"x","State":"paused","Status":"Up (Paused)"}
    EOF
      ;;
      "images --format") cat <<'EOF'
    {"ID":"sha256:img1","Repository":"nginx","Tag":"1","Size":"187MB","CreatedSince":"2 weeks ago"}
    {"ID":"sha256:img2","Repository":"postgres","Tag":"16","Size":"431MB","CreatedSince":"3 weeks ago"}
    EOF
      ;;
      "volume ls") echo '{"Name":"pgdata","Driver":"local","Mountpoint":"/var/lib/docker/volumes/pgdata/_data"}' ;;
      "network ls") echo '{"ID":"net1","Name":"bridge","Driver":"bridge","Scope":"local"}' ;;
      "inspect aaa111") cat <<'EOF'
    [{"Id":"aaa111full","Name":"/web","Path":"nginx","RestartCount":2,"Platform":"linux","State":{"Status":"running","Running":true,"Paused":false,"Pid":77,"ExitCode":0,"Error":"","StartedAt":"2026-01-01T00:00:00Z","FinishedAt":"0001-01-01T00:00:00Z"},"Config":{"Image":"nginx:1","User":"","Env":["API_KEY=topsecret","A=1"],"Labels":{"maintainer":"me"}},"HostConfig":{"RestartPolicy":{"Name":"always"}},"NetworkSettings":{"IPAddress":"172.17.0.2","Gateway":"172.17.0.1","Ports":{"80/tcp":[{"HostIp":"0.0.0.0","HostPort":"8080"}]},"Networks":{"bridge":{"IPAddress":"172.17.0.2"}}},"Mounts":[{"Source":"/srv/www","Destination":"/usr/share/nginx/html","Type":"bind","Mode":"ro"}]}]
    EOF
      ;;
      "inspect bbb222") echo '[{"Id":"bbb222full","Name":"/db","State":{"Status":"exited","Running":false},"Config":{"Image":"postgres:16"}}]' ;;
      "stats --no-stream") echo '{"CPUPerc":"1.50%","MemUsage":"20MiB / 1GiB"}' ;;
      "logs --tail") echo "starting"; echo "ERROR: boom" >&2 ;;
      "image inspect") echo '[{"Id":"sha256:img1full","RepoTags":["nginx:1"],"Size":187000000,"Created":"2026-01-01T00:00:00Z","Os":"linux","Architecture":"amd64","Config":{"Cmd":["nginx","-g","daemon off;"],"WorkingDir":"/"}}]' ;;
      "volume inspect") echo '[{"Name":"pgdata","Driver":"local","Scope":"local","Mountpoint":"/var/lib/docker/volumes/pgdata/_data","CreatedAt":"2026-01-01"}]' ;;
      "network inspect") echo '[{"Name":"bridge","Id":"net1full","Driver":"bridge","Scope":"local","IPAM":{"Config":[{"Subnet":"172.17.0.0/16"}]}}]' ;;
    esac
checks:
  - name: the containers page
    screen: main
    contains: ['"web"', 'nginx:1', 'postgres:16', '"filters"', 'Running', 'Stopped']
  - name: images, volumes and networks are on the same page
    screen: main
    contains: ['nginx:1', '187MB', 'pgdata', 'bridge']
    offers: [prune-images]
  - name: a running container offers what fits it
    screen: container
    params: { id: aaa111 }
    contains: ['"web"', 'running', '1.50%', '/usr/share/nginx/html', '172.17.0.2', 'ERROR: boom', '"levels"', 'Everything else', 'maintainer']
    not_contains: ['topsecret']
    offers: [stop, restart, pause, shell]
    not_offers: [start, remove, unpause]
  - name: a stopped container offers start and remove
    screen: container
    params: { id: bbb222 }
    offers: [start, remove]
    not_offers: [stop, shell]
  - name: environment variables are only read after they are asked for
    screen: container
    params: { id: aaa111, state.env: "true" }
    contains: ['API_KEY=topsecret']
  - name: the shell opens in the app, the agent runs nothing
    action: shell
    screen: container
    params: { id: aaa111 }
    refused: opens a terminal
  - name: an image opens in a sheet
    screen: image
    params: { id: "sha256:img1" }
    contains: ['nginx:1', 'amd64', 'daemon off']
  - name: a volume and a network
    screen: volume
    params: { name: pgdata }
    contains: ['pgdata', '/var/lib/docker/volumes/pgdata/_data']
  - name: stopping needs confirming
    action: stop
    screen: container
    params: { id: aaa111 }
    refused: confirmed
  - name: stop runs docker stop
    action: stop
    screen: container
    params: { id: aaa111 }
    confirmed: true
    ran: ["docker stop aaa111"]
  - name: removing a container needs its name typed
    action: remove
    screen: container
    params: { id: bbb222 }
    confirmed: true
    confirm_text: nope
    refused: does not match
  - name: removing an image
    action: remove-image
    screen: main
    params: { id: "sha256:img2" }
    confirmed: true
    ran: ["docker rmi sha256:img2"]
