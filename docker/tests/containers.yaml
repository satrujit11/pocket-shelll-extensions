name: containers, detail, logs and actions
fakes:
  docker: |
    case "$1" in
      --version) echo "Docker version 26.1.0" ;;
      ps) cat <<'EOF'
    {"ID":"aaa111","Names":"web","Image":"nginx:1","State":"running","Status":"Up 2 hours"}
    {"ID":"bbb222","Names":"db","Image":"postgres:16","State":"exited","Status":"Exited (0) 1 hour ago"}
    {"ID":"ccc333","Names":"odd","Image":"x","State":"paused","Status":"Up (Paused)"}
    EOF
      ;;
      inspect) cat <<'EOF'
    [{"Id":"aaa111full","Name":"/web","RestartCount":2,"State":{"Status":"running","Running":true,"Pid":77,"StartedAt":"2026-01-01T00:00:00Z"},"Config":{"Image":"nginx:1"},"HostConfig":{"RestartPolicy":{"Name":"always"}}}]
    EOF
      ;;
      logs) echo "starting"; echo "ready" >&2 ;;
    esac
checks:
  - screen: main
    contains: ['"3 containers"', '"web"', 'nginx:1']
  - screen: detail
    params: { id: aaa111 }
    contains: ['"web"', 'running', 'starting', 'ready']
    offers: [stop, restart]
    not_offers: [start, remove]
  - name: stopping needs confirming
    action: stop
    screen: detail
    params: { id: aaa111 }
    refused: confirmed
    ran: ["docker stop"]
  - name: stop runs docker stop
    action: stop
    screen: detail
    params: { id: aaa111 }
    confirmed: true
    ran: ["docker stop aaa111"]
