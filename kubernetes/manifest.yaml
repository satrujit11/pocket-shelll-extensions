spec: pocketshell.ext/v0
id: kubernetes
name: Kubernetes
description: "Pods and nodes through kubectl: status, live logs, delete a pod."
icon: cloud
category: containers
version: 1.1.0
author: Pocket Shell
docs: https://kubernetes.io/docs/reference/kubectl/
logo: https://raw.githubusercontent.com/satrujit11/pocket-shelll-extensions/main/kubernetes/logo.svg
license: Apache-2.0

detect:
  binaries: [kubectl]
  version_args: [version, --client]

permissions: [read-cluster, control-cluster]

errors:
  - match: "connection refused|Unable to connect to the server"
    title: kubectl cannot reach the cluster
    text: Check the kubeconfig of this user (KUBECONFIG, or ~/.kube/config) and that the API server is up.
  - match: "Forbidden|forbidden"
    title: This account may not do that
    text: The cluster's RBAC rules refuse it. Ask the cluster admin for access, or use another kubeconfig.

data:
  pods:
    run: [kubectl, get, pods, -A, -o, json]
    parse: json
    path: $.items
    refresh: 10s
    timeout: 15s
  nodes:
    run: [kubectl, get, nodes, -o, json]
    parse: json
    path: $.items
    refresh: 30s
    timeout: 15s
  pod:
    params: [ns, name]
    run: [kubectl, get, pod, "{{ params.name }}", -n, "{{ params.ns }}", -o, json]
    parse: json
    path: $
    refresh: 5s
    timeout: 15s
  logs:
    params: [ns, name]
    run: [kubectl, logs, "{{ params.name }}", -n, "{{ params.ns }}", --tail, "{{ state.lines }}", -f]
    parse: lines
    stream: true
    merge_stderr: true

actions:
  delete-pod:
    label: Delete pod
    icon: trash
    style: danger
    run: [kubectl, delete, pod, "{{ params.name }}", -n, "{{ params.ns }}"]
    confirm:
      title: "Delete {{ params.name }}?"
      text: Its controller will start a replacement if there is one.
      type_to_confirm: "{{ params.name }}"

screens:
  main:
    title: Kubernetes
    subtitle: "{{ data.pods | count() }} pods"
    docs: https://kubernetes.io/docs/reference/kubectl/
    tabs:
      - id: pods
        title: Pods
        badge: "{{ data.pods | count() }}"
        sections:
          - layout: { columns: 3 }
            components:
              - type: stat
                label: Running
                value: "{{ data.pods | where(row.status.phase == 'Running') | count() }}"
                tone: success
              - type: stat
                label: Pending
                value: "{{ data.pods | where(row.status.phase == 'Pending') | count() }}"
                tone: warning
              - type: stat
                label: Failed
                value: "{{ data.pods | where(row.status.phase == 'Failed') | count() }}"
                tone: danger
          - components:
              - type: list
                from: pods
                search: true
                group_by: metadata.namespace
                empty: There are no pods.
                filters:
                  - { id: running, label: Running, where: "{{ row.status.phase == 'Running' }}" }
                  - { id: pending, label: Pending, where: "{{ row.status.phase == 'Pending' }}" }
                  - { id: failed, label: Failed, where: "{{ row.status.phase == 'Failed' }}" }
                item:
                  title: "{{ row.metadata.name }}"
                  subtitle: "{{ row.metadata.namespace }}"
                  trailing: "{{ row.status.phase }}"
                  tone: "{{ row.status.phase == 'Running' ? 'success' : (row.status.phase == 'Pending' ? 'warning' : 'danger') }}"
                on_tap: { screen: pod, params: { ns: "{{ row.metadata.namespace }}", name: "{{ row.metadata.name }}" } }
      - id: nodes
        title: Nodes
        badge: "{{ data.nodes | count() }}"
        sections:
          - components:
              - type: list
                from: nodes
                empty: There are no nodes.
                item:
                  title: "{{ row.metadata.name }}"
                  subtitle: "{{ row.status.nodeInfo.kubeletVersion }}"
                  trailing: "{{ (row.status.conditions | where(row.type == 'Ready') | first()).status == 'True' ? 'Ready' : 'Not ready' }}"
                  tone: "{{ (row.status.conditions | where(row.type == 'Ready') | first()).status == 'True' ? 'success' : 'danger' }}"

  pod:
    params: [ns, name]
    docs: https://kubernetes.io/docs/concepts/workloads/pods/
    title: "{{ params.name }}"
    subtitle: "{{ params.ns }}"
    actions: [delete-pod]
    state:
      lines: { type: number, label: Lines, options: [100, 200, 500, 1000], default: 200 }
    tabs:
      - id: status
        title: Status
        sections:
          - layout: { columns: 2 }
            components:
              - type: stat
                label: Phase
                value: "{{ data.pod.status.phase }}"
                tone: "{{ data.pod.status.phase == 'Running' ? 'success' : 'warning' }}"
              - type: stat
                label: Restarts
                value: "{{ data.pod.status.containerStatuses[0].restartCount }}"
              - type: stat
                label: Started
                value: "{{ data.pod.status.startTime | ago() }}"
              - type: stat
                label: Node
                value: "{{ data.pod.spec.nodeName }}"
          - components:
              - type: properties
                value: "{{ data.pod }}"
                rest: tree
                rest_title: Everything else (the full object)
                exclude: [spec.containers]
                groups:
                  - title: Pod
                    fields:
                      - { label: Namespace, path: metadata.namespace }
                      - { label: Pod IP, path: status.podIP, copy: true }
                      - { label: Host IP, path: status.hostIP, copy: true }
                      - { label: Service account, path: spec.serviceAccountName, hide_empty: true }
                      - { label: QoS, path: status.qosClass, hide_empty: true }
                      - { label: Created, path: metadata.creationTimestamp, format: ago }
                  - title: "{{ row.name }}"
                    each: "{{ data.pod.spec.containers }}"
                    fields:
                      - { label: Image, value: "{{ row.image }}", copy: true }
                      - { label: Pull policy, value: "{{ row.imagePullPolicy }}" }
                      - { label: Command, value: "{{ row.command | join(' ') }}", mono: true }
                  - title: Labels
                    collapsible: true
                    fields:
                      - { label: Labels, path: metadata.labels, format: json, hide_empty: true, mono: true }
      - id: logs
        title: Logs
        sections:
          - components:
              - type: logs
                from: logs
                follow: true
                search: true
                controls: [lines]
                levels:
                  - { match: "error|fatal|panic|exception", level: error }
                  - { match: "warn", level: warn }
