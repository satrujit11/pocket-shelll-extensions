name: containers, detail, logs and actions (Podman prints a JSON array)
fakes:
  podman: |
    case "$1" in
      --version) echo "podman version 4.9.3" ;;
      ps) cat <<'EOF'
    [
     {"Id":"aaa111","Names":["web"],"Image":"docker.io/library/nginx:1","State":"running","Status":"Up 2 hours"},
     {"Id":"bbb222","Names":["db"],"Image":"docker.io/library/postgres:16","State":"exited","Status":"Exited (0) 1 hour ago"},
     {"Id":"ccc333","Names":["odd"],"Image":"x","State":"paused","Status":"Up (Paused)"}
    ]
    EOF
      ;;
      inspect) cat <<'EOF'
    [{"Id":"aaa111full","Name":"web","ImageName":"docker.io/library/nginx:1","RestartCount":2,"State":{"Status":"running","Running":true,"Pid":77,"StartedAt":"2026-01-01T00:00:00Z"},"HostConfig":{"RestartPolicy":{"Name":"always"}}}]
    EOF
      ;;
      logs) echo "starting"; echo "ready" >&2 ;;
    esac
checks:
  - screen: main
    contains: ['"3 containers"', '"web"', 'nginx:1']
  - screen: detail
    params: { id: aaa111 }
    contains: ['"web"', 'docker.io/library/nginx:1', 'starting', 'ready']
    offers: [stop, restart]
    not_offers: [start, remove]
  - name: stopping needs confirming
    action: stop
    screen: detail
    params: { id: aaa111 }
    refused: confirmed
    ran: ["podman stop"]
  - name: stop runs podman stop
    action: stop
    screen: detail
    params: { id: aaa111 }
    confirmed: true
    ran: ["podman stop aaa111"]
