# A complete example: systemd services with tabs, cards, a detail screen,
# live logs and actions. Needs systemd 248 or newer (JSON output).
spec: pocketshell.ext/v0
id: systemd
name: Services
description: "systemd services: what runs, what failed, logs, start, stop and restart."
icon: server
category: system
version: 1.1.0
author: Pocket Shell
docs: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html
license: Apache-2.0
requires: [chart, logs, table]

detect:
  binaries: [systemctl]
  version_args: [--version]

permissions: [read-services, control-services, sudo]

errors:
  - match: "Failed to connect to bus|System has not been booted with systemd"
    title: systemd is not available here
    text: This server does not run systemd (a container, or another init system), so there are no units to show.
  - match: "access denied|Interactive authentication required"
    title: Not allowed to control services
    text: Starting and stopping services needs root. Allow sudo for this user, then try again.

data:
  units:
    run: [systemctl, list-units, --type=service, --all, --no-pager, --output=json]
    parse: json
    path: $
    refresh: 10s
    timeout: 8s
  unit:
    params: [name]
    run: [systemctl, show, "{{ params.name }}", --no-pager]
    parse: keyvalue
    refresh: 5s
  journal:
    params: [name]
    run: [journalctl, -u, "{{ params.name }}", -n, "{{ state.lines }}", -f, --no-pager, --output=short-iso]
    parse: lines
    stream: true
    privilege: sudo

actions:
  start:
    label: Start
    icon: play
    style: primary
    visible: "{{ data.unit.ActiveState != 'active' }}"
    run: [systemctl, start, "{{ params.name }}"]
    privilege: sudo
    after: [{ refresh: units }, { refresh: unit }]
  stop:
    label: Stop
    icon: stop
    style: danger
    visible: "{{ data.unit.ActiveState == 'active' }}"
    run: [systemctl, stop, "{{ params.name }}"]
    privilege: sudo
    confirm:
      title: "Stop {{ params.name }}?"
      text: Anything using this service will stop working until it is started again.
      type_to_confirm: "{{ params.name }}"
    after: [{ refresh: units }, { refresh: unit }]
  restart:
    label: Restart
    icon: restart
    run: [systemctl, restart, "{{ params.name }}"]
    privilege: sudo
    confirm:
      title: "Restart {{ params.name }}?"
      text: It is unavailable for a moment.
    after: [{ refresh: units }, { refresh: unit }]
  reload-daemon:
    label: Reload systemd
    icon: restart
    run: [systemctl, daemon-reload]
    privilege: sudo
    result: toast

screens:
  main:
    title: Services
    subtitle: "{{ data.units | count() }} units"
    docs: https://www.freedesktop.org/software/systemd/man/latest/systemctl.html
    actions: [reload-daemon]
    sections:
      - layout: { columns: 3 }
        components:
          - type: stat
            label: Running
            value: "{{ data.units | where(row.sub == 'running') | count() }}"
            tone: success
          - type: stat
            label: Failed
            value: "{{ data.units | where(row.active == 'failed') | count() }}"
            tone: danger
          - type: stat
            label: Stopped
            value: "{{ data.units | where(row.sub == 'dead') | count() }}"
            tone: muted
      - components:
          - type: list
            from: units
            search: true
            sort: unit
            empty: There are no services.
            filters:
              - { id: failed, label: Failed, where: "{{ row.active == 'failed' }}" }
              - { id: running, label: Running, where: "{{ row.sub == 'running' }}" }
              - { id: stopped, label: Stopped, where: "{{ row.sub == 'dead' }}" }
            item:
              title: "{{ row.unit }}"
              subtitle: "{{ row.description }}"
              trailing: "{{ row.sub }}"
              tone: "{{ row.active == 'failed' ? 'danger' : (row.sub == 'running' ? 'success' : 'muted') }}"
            on_tap: { screen: detail, params: { name: "{{ row.unit }}" } }

  detail:
    params: [name]
    docs: https://www.freedesktop.org/software/systemd/man/latest/systemd.service.html
    title: "{{ params.name }}"
    subtitle: "{{ data.unit.Description }}"
    actions: [start, stop, restart]
    state:
      lines: { type: number, label: Lines, options: [100, 200, 500, 1000], default: 200 }
    tabs:
      - id: status
        title: Status
        sections:
          - layout: { columns: 2 }
            components:
              - type: stat
                label: State
                value: "{{ data.unit.ActiveState }}"
                detail: "{{ data.unit.SubState }}"
                tone: "{{ data.unit.ActiveState == 'active' ? 'success' : 'danger' }}"
              - type: stat
                label: Memory
                value: "{{ data.unit.MemoryCurrent | bytes() }}"
              - type: stat
                label: Tasks
                value: "{{ data.unit.TasksCurrent }}"
              - type: stat
                label: Since
                value: "{{ data.unit.ActiveEnterTimestamp | ago() }}"
          - components:
              - type: properties
                value: "{{ data.unit }}"
                groups:
                  - title: Service
                    fields:
                      - { label: Main PID, path: MainPID, copy: true }
                      - { label: Unit file, path: FragmentPath, copy: true, mono: true }
                      - { label: Starts at boot, path: UnitFileState, hide_empty: true }
                      - { label: Restart policy, path: Restart, hide_empty: true }
                      - { label: Runs as, path: User, hide_empty: true }
                      - { label: Working dir, path: WorkingDirectory, hide_empty: true, mono: true }
                      - { label: Command, path: ExecStart, hide_empty: true, mono: true }
      - id: logs
        title: Logs
        sections:
          - components:
              - type: logs
                from: journal
                follow: true
                search: true
                controls: [lines]
                levels:
                  - { match: "error|fail|fatal|panic", level: error }
                  - { match: "warn", level: warn }
