name: status, rules and changing them
fakes:
  ufw: |
    case "$1 $2" in
      "status verbose") cat <<'EOF'
    Status: active
    Logging: on (low)
    Default: deny (incoming), allow (outgoing), disabled (routed)
    New profiles: skip

    To                         Action      From
    --                         ------      ----
    22/tcp                     ALLOW IN    Anywhere
    80/tcp                     ALLOW IN    Anywhere
    EOF
      ;;
      "status numbered") cat <<'EOF'
    Status: active

         To                         Action      From
         --                         ------      ----
    [ 1] 22/tcp                     ALLOW IN    Anywhere
    [ 2] 80/tcp                     ALLOW IN    Anywhere
    [ 3] 23/tcp                     DENY IN     10.0.0.0/8
    EOF
      ;;
    esac
checks:
  - screen: main
    contains: ['active', 'deny (incoming)', 'on (low)', '22/tcp', '23/tcp', 'DENY IN']
    offers: [allow, deny, disable]
    not_offers: [enable]
  - screen: rule
    params: { n: "3" }
    contains: ['Rule 3', '23/tcp', '10.0.0.0/8']
    offers: [delete-rule]
  - name: allow builds the port rule
    action: allow
    screen: main
    form: { port: 8080, proto: tcp }
    ran: ["sudo -n -- ufw allow 8080/tcp"]
  - name: a bad port is refused
    action: allow
    screen: main
    form: { port: 99999, proto: tcp }
    refused: at most
  - name: deleting asks first
    action: delete-rule
    screen: rule
    params: { n: "3" }
    refused: confirmed
  - name: delete runs
    action: delete-rule
    screen: rule
    params: { n: "3" }
    confirmed: true
    ran: ["ufw --force delete 3"]
  - name: turning the firewall off needs the word typed
    action: disable
    screen: main
    confirmed: true
    confirm_text: nope
    refused: does not match
